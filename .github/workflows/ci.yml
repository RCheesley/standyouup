name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      # Built universal, as releases are, so a break in the Intel build shows up here.
      - name: Build app bundle
        run: UNIVERSAL=1 ./build.sh

      - name: Check the app runs on Apple Silicon and Intel
        run: |
          archs="$(lipo -archs StandYouUp.app/Contents/MacOS/StandYouUp)"
          echo "Architectures: ${archs}"
          [[ "${archs}" == *arm64* && "${archs}" == *x86_64* ]]

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${version}). Update VERSION and tag again."
            exit 1
          fi

      - name: Build app bundle
        run: UNIVERSAL=1 ./build.sh

      # NOTE: The bundle is currently ad-hoc signed. For friction-free installs,
      # add Developer ID signing + notarization here (import certificate, then
      # `codesign --options runtime` and `xcrun notarytool submit`) using repo
      # secrets, before zipping.

      - name: Zip app
        run: ditto -c -k --keepParent StandYouUp.app StandYouUp.zip

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: StandYouUp.zip
          generate_release_notes: true
