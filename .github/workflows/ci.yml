name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Build app bundle
        run: ./build.sh

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build.sh

      # NOTE: The bundle is currently ad-hoc signed. For friction-free installs,
      # add Developer ID signing + notarization here (import certificate, then
      # `codesign --options runtime` and `xcrun notarytool submit`) using repo
      # secrets, before zipping.

      - name: Zip app
        run: ditto -c -k --keepParent StandYouUp.app StandYouUp.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: StandYouUp.zip
          generate_release_notes: true
